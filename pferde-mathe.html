<style>
/* Pferde-Mathe – sanft, groß, freundlich */
:root{
  --bg:#fdf7ec; --meadow:#cdeac0; --meadow2:#a9d89a; --sky:#d9efff;
  --ink:#4a3b30; --soft:#7a685a; --brown:#b07a4f; --brown-d:#7d5233;
  --gold:#f2c14e; --gold-d:#c9962a; --pink:#f7b8c8; --lav:#e6dcf7; --lav-d:#b9a6e3;
  --mint:#c8f0d8; --mint-d:#5fbf86; --blue:#8ec9e8; --orange:#f6b26b;
  --card:#fffdf8; --shadow:0 4px 0 rgba(125,82,51,.18), 0 8px 18px rgba(125,82,51,.12);
  --r:22px;
  --font: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Arial Rounded MT Bold", "Nunito", "Avenir Next", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:20px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:linear-gradient(180deg,var(--sky) 0%,var(--bg) 38%,var(--bg) 100%)}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:72px}
.topbar .title{flex:1;font-size:1.35rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:60px;height:60px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:1.6rem;
  display:flex;align-items:center;justify-content:center;padding:0 12px}
.iconbtn:active{transform:translateY(2px)}
.counter{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:30px;padding:6px 14px 6px 8px;
  box-shadow:var(--shadow);font-weight:800;font-size:1.25rem;height:52px}
.counter svg{width:36px;height:36px}
.counter .emo{font-size:1.6rem}

main#screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.screen{min-height:100%;padding:8px 18px 24px;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Luna + Sprechblase */
.luna-wrap{display:flex;align-items:flex-end;gap:10px}
.luna{width:150px;flex:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.08))}
.luna.small{width:104px}
.bubble{position:relative;background:var(--card);border-radius:24px;padding:14px 18px;box-shadow:var(--shadow);
  font-size:1.15rem;line-height:1.35;flex:1;min-height:60px;margin-bottom:26px}
.bubble::before{content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right:16px solid var(--card)}
.bubble.pop{animation:bubblePop .4s ease}
@keyframes bubblePop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.bubble.think{background:#f4efff}.bubble.think::before{border-right-color:#f4efff}

svg.horse{width:100%;height:auto;overflow:visible}
svg.horse .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
svg.horse .tail{transform-box:fill-box;transform-origin:90% 10%;animation:tail 3.2s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
.happy svg.horse,.luna.happy{animation:nod .9s ease}
@keyframes nod{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}

/* Home */
.home .hero{max-width:900px;margin:4px auto 14px}
.home .luna{width:190px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:980px;margin:0 auto}
.tile{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:18px 12px;min-height:150px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;font-size:1.2rem;font-weight:800;text-align:center;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:3rem;line-height:1}
.tile small{font-weight:600;color:var(--soft);font-size:.85rem}
.tile.c1{background:#ffe6ee}.tile.c2{background:#fff1d6}.tile.c3{background:#e2f3ff}.tile.c4{background:#ecf9e3}.tile.c5{background:#f1eaff}
.tile.stall{background:linear-gradient(160deg,#fff4d6,#ffe1c2)}
.parent-link{display:block;margin:22px auto 0;background:transparent;color:var(--soft);font-size:.95rem;padding:14px 20px;border-radius:16px}
.bday{max-width:900px;margin:0 auto 10px;background:linear-gradient(90deg,#ffe0ec,#fff3c9,#e0f4ff);border-radius:22px;padding:12px 18px;
  text-align:center;font-weight:800;font-size:1.15rem;box-shadow:var(--shadow)}

/* Game layout */
.game{display:flex;flex-direction:column;gap:12px;max-width:1100px;margin:0 auto}
.game-top{display:flex;align-items:flex-end;gap:12px}
.game-top .luna-wrap{flex:1}
.progress{display:flex;gap:6px;flex:none;margin-bottom:30px}
.progress svg{width:36px;height:36px;transition:transform .3s}
.progress .on svg{transform:scale(1.15)}
.stage{display:flex;gap:18px;align-items:flex-start}
.stage > .left{flex:1.2;min-width:0;display:flex;flex-direction:column;gap:14px;align-items:center}
.stage > .right{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;align-items:stretch}
@media (orientation:portrait){
  .stage{flex-direction:column;align-items:stretch}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .home .luna{width:160px}
}

/* Zahlen-Knöpfe */
.pad{display:grid;gap:10px;width:100%}
.pad.pad10{grid-template-columns:repeat(6,1fr)}
.pad.pad20{grid-template-columns:repeat(7,1fr)}
.num{min-height:70px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:1.75rem;font-weight:800;transition:background .2s, transform .15s}
.num:active{transform:translateY(2px) scale(.98)}
.num.soft-no{background:var(--lav);animation:softShake .6s ease}
.num.yes{background:var(--mint)}
.num.glow{animation:glow 1.2s ease-in-out infinite;background:#fff6cc}
@keyframes softShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.7),var(--shadow)}50%{box-shadow:0 0 0 10px rgba(242,193,78,.25),var(--shadow)}}

.eq{font-size:3rem;font-weight:800;letter-spacing:.02em;background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:10px 28px;white-space:nowrap}
.ans{display:inline-block;min-width:1.6em;text-align:center;border-bottom:5px dotted var(--brown);color:var(--brown-d)}
.ans.filled{border-bottom-color:transparent;color:var(--mint-d);animation:bubblePop .4s}
.softbtn{min-height:60px;border-radius:20px;background:#fff3c4;box-shadow:var(--shadow);font-size:1.1rem;font-weight:800;padding:8px 20px}
.softbtn:disabled{opacity:.5}
.note{color:var(--soft);font-size:.95rem;text-align:center}

/* Zwanzigerfeld */
.zf{display:grid;grid-template-columns:repeat(5,1fr) 14px repeat(5,1fr);gap:6px;background:#fff;border:4px solid #e9d8c4;border-radius:18px;padding:10px;width:100%;max-width:560px}
.zf .gap{grid-row:span 2}
.zf.ten .gap{grid-row:span 1}
.cell{aspect-ratio:1;border-radius:50%;border:3px dashed #e3d3c0;background:#fffaf2;display:flex;align-items:center;justify-content:center;min-width:0;padding:0;transition:background .25s, transform .25s}
.cell.a{background:var(--orange);border:3px solid #e39a4c}
.cell.b{background:var(--blue);border:3px solid #5fa9d1;animation:bubblePop .3s}
.cell.gone{background:transparent;border:3px dashed #d8c7b4;opacity:.55;transform:scale(.85)}
.zf.pulse{animation:glow 1.2s ease-in-out 3}
.zf-caption{font-size:1.5rem;font-weight:800;color:var(--brown-d);min-height:1.6em}
.strategy{background:#fffbea;border-radius:18px;padding:10px 18px;font-size:1.45rem;font-weight:800;text-align:center;line-height:1.5;box-shadow:var(--shadow)}
.strategy:empty{display:none}
.strategy .s2{color:#3f8fb8}.strategy .s1{color:#d07d2b}

/* Paare / Memory */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:100%;max-width:980px;margin:0 auto;perspective:900px}
.mcard{position:relative;aspect-ratio:3/3.4;border-radius:22px;background:transparent;padding:0;transition:transform .3s}
.mcard .face{position:absolute;inset:0;border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:background .3s, transform .3s}
.mcard .front{background:var(--card);font-size:3.2rem;font-weight:800}
.mcard .back{background:linear-gradient(145deg,#ffd9a8,#f7b8c8);display:none}
.mcard .back svg{width:48%}
.mcard.down .front{display:none}
.mcard.down .back{display:flex}
.mcard.flip{animation:flip .35s ease}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.mcard.sel .front{background:#fff3c4;transform:translateY(-6px)}
.mcard.matched .front{background:#ffe3ec}
.mcard.matched{opacity:.8}
.mcard.matched .heart{display:block}
.mcard .heart{display:none;position:absolute;top:6px;right:10px;font-size:1.6rem}
.mcard.glow .front{animation:glow 1.2s ease-in-out infinite}
.mini10{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:62%}
.mini10 i{aspect-ratio:1;border-radius:50%;border:2px solid #e3d3c0;display:block}
.mini10 i.f{background:var(--orange);border-color:#e39a4c}

/* Zahlenhaus */
.house{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.roof{width:100%;height:120px;background:linear-gradient(160deg,#e58f73,#c96a52);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.roof .hc{width:92px;height:70px;font-size:2.3rem}
.floors{width:88%;background:#fff6e6;border:5px solid #e6cfa9;border-top:0;border-radius:0 0 16px 16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.floor{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hc{height:70px;border-radius:16px;background:#fff;border:3px solid #ead7bb;display:flex;align-items:center;justify-content:center;font-size:2.1rem;font-weight:800;padding:0}
.hc.blank{background:#fffdf3;border:3px dashed var(--brown);color:var(--brown-d)}
.hc.blank.cur{border-style:solid;border-color:var(--gold-d);background:#fff3c4;animation:glow 1.6s ease-in-out infinite}
.hc.filled{background:var(--mint);border-color:var(--mint-d);animation:bubblePop .35s}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:460px;min-height:10px}
.dots i{width:30px;height:30px;border-radius:50%;border:3px dashed #d7c2a8;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem;font-weight:800;color:var(--brown-d)}
.dots i.f{background:var(--orange);border:3px solid #e39a4c}
.dots i.g{background:var(--blue);border:3px solid #5fa9d1}
.dots.strong i:not(.f):not(.g){background:#fff3c4;border-color:var(--gold-d);border-style:solid}

/* Familie */
.family{display:flex;align-items:flex-end;justify-content:center;gap:8px;background:#f3fbef;border-radius:26px;padding:10px 18px;box-shadow:var(--shadow)}
.fm{display:flex;flex-direction:column;align-items:center}
.fm .badge{background:var(--card);border-radius:16px;padding:2px 16px;font-size:1.9rem;font-weight:800;box-shadow:var(--shadow);margin-top:-6px}
.fm.big .horsebox{width:150px}.fm.kid .horsebox{width:96px}
.family.pulse .badge{animation:glow 1.2s ease-in-out 3}
.rows{display:flex;flex-direction:column;gap:10px;width:100%;max-width:480px}
.row{display:flex;align-items:center;justify-content:center;gap:10px;font-size:2.1rem;font-weight:800;background:var(--card);border-radius:20px;padding:6px 14px;box-shadow:var(--shadow);opacity:.75}
.row.cur{opacity:1;outline:4px solid var(--gold);background:#fffbe9}
.row.ok{opacity:1;background:#effaf2}
.row .bx{min-width:1.6em;text-align:center;border-bottom:5px dotted var(--brown);color:var(--brown-d)}
.row .bx.filled{border-color:transparent;color:var(--mint-d)}
.row .star{font-size:1.4rem;width:1.4em}
.choices{display:flex;flex-direction:column;gap:14px;width:100%}
.choice{min-height:80px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);font-size:2.2rem;font-weight:800}
.choice.soft-no{background:var(--lav);animation:softShake .6s}
.choice.yes{background:var(--mint)}
.choice.glow{animation:glow 1.2s ease-in-out infinite;background:#fff6cc}

/* Zahlenstrahl */
.line-wrap{width:100%;background:linear-gradient(180deg,#e9f6ff 0%,#e9f6ff 55%,#cdeac0 55%,#bfe3b0 100%);border-radius:26px;box-shadow:var(--shadow);padding:18px 10px 10px;position:relative}
.line-horse{position:absolute;top:40px;width:90px;transform:translateX(-50%);transition:left .32s ease;z-index:2;pointer-events:none}
.line-horse.hop svg{animation:hop .32s ease}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.ticks{display:flex;margin-top:96px;position:relative}
.ticks::before{content:"";position:absolute;left:calc(100%/42);right:calc(100%/42);top:22px;height:6px;background:var(--brown-d);border-radius:3px}
.ticks.t10::before{left:calc(100%/22);right:calc(100%/22)}
.tick{flex:1;min-width:0;height:96px;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;position:relative;border-radius:12px}
.tick .m{width:4px;height:30px;background:var(--brown-d);margin-top:10px;border-radius:2px}
.tick.five .m{height:44px;margin-top:3px;width:6px}
.tick .lb{margin-top:6px;font-weight:800;font-size:1.05rem}
.ticks.t10 .tick .lb{font-size:1.6rem}
.tick.soft-no{background:var(--lav)}
.tick.seg{background:#fff3c4}
.tick.yes{background:var(--mint)}
.tick.glow{animation:glow 1.2s ease-in-out infinite;background:#fff6cc}
.tick.start .lb{color:#d07d2b}
.arc{position:absolute;top:-30px;font-size:1rem;font-weight:800;color:#3f8fb8;transform:translateX(-50%);animation:bubblePop .3s}
.task-big{font-size:2.2rem;font-weight:800;background:var(--card);border-radius:22px;padding:8px 26px;box-shadow:var(--shadow);text-align:center}

/* Rundenende */
.end{max-width:760px;margin:10px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.end .luna{width:220px}
.end h2{font-size:2.2rem;margin:0}
.loot{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.loot div{background:var(--card);border-radius:22px;padding:10px 22px;box-shadow:var(--shadow);font-size:1.6rem;font-weight:800;display:flex;align-items:center;gap:8px}
.loot svg{width:44px;height:44px}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bigbtn{min-height:76px;min-width:200px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);font-size:1.3rem;font-weight:800;padding:10px 24px}
.bigbtn.primary{background:#ffe08a}
.bigbtn:active{transform:translateY(2px)}

/* Eltern */
.parent{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 18px}
.panel h3{margin:2px 0 10px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0e6da;flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow .pn{flex:1;min-width:200px;font-weight:700}
.prow .pn small{display:block;font-weight:500;color:var(--soft);font-size:.85rem}
.bar{width:140px;height:14px;background:#f0e6da;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint-d)}
.tag{font-size:.8rem;font-weight:800;border-radius:10px;padding:4px 10px;background:#eee}
.tag.good{background:var(--mint)}.tag.mid{background:#fff1c2}.tag.help{background:#ffdede}.tag.none{background:#f1ede8;color:var(--soft)}
.smallbtn{min-height:48px;min-width:48px;border-radius:14px;background:#f6efe5;font-weight:800;font-size:1.1rem;padding:4px 12px}
.gate{max-width:560px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.holdbtn{position:relative;overflow:hidden;width:320px;height:96px;border-radius:26px;background:#f3ece3;font-size:1.2rem;font-weight:800;box-shadow:var(--shadow);touch-action:none}
.holdbtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:#cfe9c2;z-index:0}
.holdbtn span{position:relative;z-index:1}
.danger{background:#ffe9e0}
.trouble{display:flex;flex-wrap:wrap;gap:8px}
.trouble span{background:#fff1c2;border-radius:12px;padding:4px 10px;font-weight:700}

/* Effekte */
.fx{position:fixed;pointer-events:none;font-size:2rem;z-index:7000;animation:floatUp 1.3s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-120px) scale(1.1)}}
@media (prefers-reduced-motion:reduce) and (min-width:0px){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-height:820px) and (orientation:landscape){
  .fm.big .horsebox{width:112px}.fm.kid .horsebox{width:76px}.row{font-size:1.8rem;padding:4px 14px}.rows{gap:8px}
}
@media (max-height:700px) and (orientation:landscape){
  .luna.small{width:84px}.eq{font-size:2.4rem}.num{min-height:62px}.bubble{font-size:1.05rem}
}
input,select{font:inherit;font-size:1.05rem;min-height:52px;border-radius:14px;border:2px solid #e6d6c3;background:#fff;padding:6px 12px;color:var(--ink);-webkit-user-select:text;user-select:text}
input{min-width:220px}
.setup{max-width:900px;margin:0 auto 10px;background:#fff;border:2px dashed #e6d6c3;border-radius:22px;padding:12px 18px;display:flex;flex-direction:column;gap:10px;font-size:1rem}
.setup .btnrow{justify-content:flex-start}

/* ================= Pferdehof (Vollbild) ================= */
.farm-screen{position:fixed;inset:0;overflow:hidden}
.farm{position:fixed;inset:0;overflow:hidden;touch-action:none;--px:0;background:#a3d684;-webkit-user-select:none;user-select:none}
.farm .sky{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#8fd0ff 0%,#bfe6ff 38%,#e9f7ff 54%,#f6fbf0 62%)}
.farm.evening .sky{background:linear-gradient(180deg,#8d86d6 0%,#c89ad0 22%,#f3a9b8 38%,#ffc59a 50%,#ffe0ad 60%)}
.farm .tint{position:absolute;inset:0;z-index:3000;pointer-events:none;background:transparent}
.farm.evening .tint{background:linear-gradient(180deg,rgba(255,170,120,0) 40%,rgba(255,170,120,.16) 100%)}
.px1{transform:translateX(calc(var(--px) * -6px));transition:transform 1.2s ease-out}
.px2{transform:translateX(calc(var(--px) * -14px));transition:transform 1s ease-out}
.px3{transform:translateX(calc(var(--px) * -24px));transition:transform .9s ease-out}
.farm .sun{position:absolute;z-index:1;left:78%;top:7%;width:16vmin;height:16vmin}
.farm .sun-core{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#fff6c2 0%,#ffe27a 55%,#ffd35a 70%,rgba(255,211,90,0) 72%);box-shadow:0 0 6vmin 2vmin rgba(255,226,122,.55);animation:sunGlow 6s ease-in-out infinite}
.farm.evening .sun{left:68%;top:36%;width:22vmin;height:22vmin}
.farm.evening .sun-core{background:radial-gradient(circle,#fff0c2 0%,#ffb877 55%,#ff9d7a 70%,rgba(255,157,122,0) 72%);box-shadow:0 0 9vmin 4vmin rgba(255,170,120,.45)}
@keyframes sunGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.farm .star{position:absolute;z-index:1;width:5px;height:5px;border-radius:50%;background:#fffbe6;box-shadow:0 0 6px 2px rgba(255,251,230,.7);animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
.farm .cloud{position:absolute;z-index:3;left:0;width:calc(var(--cs,20) * 1vmin);color:#fff;opacity:.92;animation:drift 150s linear infinite}
.farm.evening .cloud{color:#ffe3ec}
.farm .cloud svg{width:100%;display:block}
@keyframes drift{from{transform:translateX(-40vmin)}to{transform:translateX(105vw)}}
.farm .bird{position:absolute;z-index:3;left:0;width:5vmin;animation:fly 50s linear infinite;cursor:pointer;padding:1vmin}
.farm .bird svg{width:100%;display:block}
.farm .flapb{transform-box:fill-box;transform-origin:center;animation:flapb .7s ease-in-out infinite}
@keyframes flapb{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
@keyframes fly{0%{transform:translate(-10vw,0)}25%{transform:translate(20vw,-2vmin)}50%{transform:translate(50vw,1vmin)}75%{transform:translate(80vw,-1vmin)}100%{transform:translate(110vw,0)}}
.farm .skylayer{position:absolute;inset:0;z-index:2;pointer-events:none}
.farm .skylayer .item{pointer-events:auto}
.farm .layer{position:absolute;left:-4%;width:108%;pointer-events:none}
.farm .layer svg{width:100%;height:100%;display:block}
.farm .hills-far{bottom:44%;height:22%;z-index:4}
.farm .hills-mid{bottom:38%;height:22%;z-index:5}
.farm .meadow{bottom:0;height:54%;z-index:6}
.farm.evening .hills-far svg path{fill:#c9d9a6}
.farm .scen,.farm .item,.farm .tuft,.farm .flw{position:absolute;transform:translate(-50%,-100%);width:calc(var(--s,10) * 1vmin);line-height:0}
.farm .scen svg,.farm .item svg,.farm .tuft svg,.farm .flw svg{width:100%;height:auto;display:block;overflow:visible}
.farm .tuft,.farm .flw{pointer-events:none}
.farm .fence{position:absolute;left:41%;width:62%;top:calc(58% - 9vmin);height:9vmin;pointer-events:none}
.farm .fence svg{width:100%;height:100%;display:block}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.8s ease-in-out infinite}
.farm .tuft.sway{transform-origin:50% 100%;animation-name:swayT}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes swayT{0%,100%{transform:translate(-50%,-100%) rotate(-4deg)}50%{transform:translate(-50%,-100%) rotate(4deg)}}
.farm .barn{cursor:pointer}
.farm .barn .door{transform-box:view-box;transition:transform .9s cubic-bezier(.4,.1,.3,1)}
.farm .barn .dl{transform-origin:92px 253px}.farm .barn .dr{transform-origin:228px 253px}
.farm .barn.open .door{transform:scaleX(.14)}
.farm .barn .vane{transform-box:view-box;transform-origin:160px 54px;animation:vane 7s ease-in-out infinite}
@keyframes vane{0%,100%{transform:scaleX(1)}45%{transform:scaleX(.55)}55%{transform:scaleX(.55)}}
.glow-win{animation:winGlow 4s ease-in-out infinite}
@keyframes winGlow{0%,100%{opacity:1}50%{opacity:.8}}
.farm .tree .canopy{transform-box:fill-box;transform-origin:50% 90%;animation:sway 7s ease-in-out infinite}
.farm .pond{pointer-events:auto}
.farm .pond .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 4s ease-out infinite}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.farm .duck{position:absolute;width:calc(var(--s) * 1vmin);animation:swim 22s ease-in-out infinite;cursor:pointer;line-height:0}
.farm .duck svg{width:100%;display:block}
.farm .duck.bob svg{animation:itemBounce2 .6s ease}
@keyframes swim{0%{transform:translateX(0) scaleX(1)}45%{transform:translateX(16vmin) scaleX(1)}50%{transform:translateX(16vmin) scaleX(-1)}95%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes itemBounce2{0%,100%{transform:translateY(0)}40%{transform:translateY(-12%)}}
.farm .fly{position:absolute;width:4.4vmin;pointer-events:none;animation:flyA 26s ease-in-out infinite}
.farm .fly svg{width:100%;display:block}
.farm .fly .wings{transform-box:fill-box;transform-origin:center;animation:flap .32s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
.farm .fly.f0{animation-name:flyA}.farm .fly.f1{animation-name:flyB;animation-duration:31s}.farm .fly.f2{animation-name:flyC;animation-duration:24s}.farm .fly.f3{animation-name:flyB;animation-duration:36s;animation-direction:reverse}
@keyframes flyA{0%{left:10%;top:60%}20%{left:30%;top:52%}40%{left:48%;top:66%}60%{left:70%;top:55%}80%{left:40%;top:72%}100%{left:10%;top:60%}}
@keyframes flyB{0%{left:80%;top:58%}25%{left:60%;top:70%}50%{left:30%;top:62%}75%{left:55%;top:50%}100%{left:80%;top:58%}}
@keyframes flyC{0%{left:20%;top:80%}30%{left:45%;top:60%}60%{left:85%;top:74%}100%{left:20%;top:80%}}
.farm .item{cursor:grab;touch-action:none;transition:filter .4s}
.farm .item.dragging{transition:none;filter:drop-shadow(0 1.5vmin 1vmin rgba(60,90,40,.25));cursor:grabbing}
.farm .item.settle{transition:left .35s cubic-bezier(.34,1.56,.64,1),top .35s cubic-bezier(.34,1.56,.64,1)}
.farm .item.new{animation:sparkleIn 1s ease}
@keyframes sparkleIn{0%{transform:translate(-50%,-100%) scale(.3);opacity:0}60%{transform:translate(-50%,-100%) scale(1.12);opacity:1}100%{transform:translate(-50%,-100%) scale(1)}}
.farm .item.bounce svg{animation:itemBounce2 .6s ease}
.farm .item.yay svg{animation:yay .9s ease}
@keyframes yay{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14%) rotate(-3deg)}50%{transform:translateY(0) rotate(2deg)}70%{transform:translateY(-5%)}}
.farm .item.munch .head{animation:munch .35s ease-in-out 5}
@keyframes munch{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
.farm .item.target{filter:drop-shadow(0 0 1.6vmin rgba(255,226,122,.95))}
.farm .item.shiny{filter:brightness(1.07) saturate(1.1) drop-shadow(0 0 1.4vmin rgba(255,240,180,.95))}
.farm .item .shine{position:absolute;inset:20% 20% 30% 15%;pointer-events:none;opacity:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:250% 100%;border-radius:50%}
.farm .item.shiny .shine{opacity:1;animation:shineSweep 1.6s ease-in-out 3}
@keyframes shineSweep{from{background-position:120% 0}to{background-position:-120% 0}}
svg.horse .head{transform-box:view-box;transform-origin:128px 96px;animation:headbob 5.5s ease-in-out infinite}
@keyframes headbob{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}55%{transform:rotate(1.5deg)}75%{transform:rotate(0)}}
.kitten{transform-box:fill-box;transform-origin:50% 100%;animation:kit 6s ease-in-out infinite}
@keyframes kit{0%,100%{transform:translateY(0)}50%{transform:translateY(3%)}}
.peck{transform-box:fill-box;transform-origin:50% 100%;animation:peck 3.2s ease-in-out infinite}
@keyframes peck{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(12deg)}90%{transform:rotate(0)}}
.wag{transform-box:fill-box;transform-origin:100% 90%;animation:wag .8s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(.88,1.08)}}
.shimmer{animation:twinkle 3s ease-in-out infinite}
.sparkle{position:fixed;z-index:7000;pointer-events:none;color:#ffe9a8;text-shadow:0 0 8px #fff3c4;font-size:26px;transform:translate(-50%,-50%);animation:spark .9s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%) scale(1.2) rotate(40deg)}}
.ghost{position:fixed;z-index:6500;width:78px;pointer-events:none;transform:translate(-50%,-60%) rotate(-8deg);filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.ghost svg{width:100%;display:block}
/* Bedienelemente auf dem Hof */
.farm-ui{position:absolute;inset:0;z-index:5000;pointer-events:none}
.farm-ui > *{pointer-events:auto}
.farm-btn{width:54px;height:54px;border-radius:50%;background:rgba(255,253,248,.78);box-shadow:0 3px 10px rgba(80,60,40,.15);font-size:1.45rem;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.farm-btn:active{transform:scale(.95)}
.farm-btn.back{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));opacity:.85}
.farm-hud{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
.farm-hud .counter{height:46px;background:rgba(255,253,248,.78);box-shadow:0 3px 10px rgba(80,60,40,.12);font-size:1.1rem}
.farm-hud .counter svg,.counter .emo svg{width:30px;height:30px;display:block}

.lad-btn.buy{background:linear-gradient(180deg,#8fe0a8,#4fc07a);color:#144a2c;box-shadow:0 4px 0 #3a9a60,0 8px 14px rgba(58,154,96,.25)}
.lad-btn.buy:active{transform:translateY(3px);box-shadow:0 1px 0 #3a9a60}
.lad-btn.later{background:#efe7dc;color:#8a7868;font-size:.88rem}
.lad-btn.have{background:#dff3e4;color:#3b8a5a}
.lad-card.ready .lc-art{animation:pm-ready 2.4s ease-in-out infinite}
@keyframes pm-ready{0%,100%{box-shadow:inset 0 0 0 0 rgba(120,210,150,0)}50%{box-shadow:inset 0 0 0 4px rgba(120,210,150,.4)}}
/* Bestätigen und Feiern */
.lad-confirm,.lad-cele{background:linear-gradient(180deg,#fffdf8,#fff3dc);border-radius:34px;padding:24px 28px;width:min(520px,100%);text-align:center;box-shadow:0 22px 50px rgba(80,60,40,.3);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px}
.lad-confirm h3,.lad-cele h2{margin:4px 0}
.lc-pv{height:150px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.lc-pv>svg{max-height:140px;width:auto;max-width:240px}
.lc-pv>svg.horse{width:220px;max-height:none}
.lc-price{font-weight:800;font-size:1.4rem;display:flex;align-items:center;justify-content:center;gap:6px;margin:0}
.lc-price svg{width:34px;height:34px}.lc-price i{font-style:normal}
.lc-left{margin:0;color:var(--soft);font-size:.98rem}.lc-left svg{width:22px;height:22px;vertical-align:-5px}
.lc-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;width:100%}
.lc-btns .bigbtn{min-width:180px;flex:1 1 180px}
.lc-extra{font-weight:700;color:#3f6f52}
.lc-rays{position:absolute;inset:-60% -20% auto;height:200%;background:conic-gradient(from 0deg,rgba(255,224,138,.55) 0 8deg,transparent 8deg 22deg,rgba(255,224,138,.55) 22deg 30deg,transparent 30deg 45deg,rgba(255,224,138,.5) 45deg 52deg,transparent 52deg 67deg,rgba(255,224,138,.5) 67deg 75deg,transparent 75deg 90deg,rgba(255,224,138,.5) 90deg 98deg,transparent 98deg 360deg);animation:pm-spin 18s linear infinite;opacity:.6;pointer-events:none;-webkit-mask-image:radial-gradient(circle at 50% 38%,#000 0,transparent 55%);mask-image:radial-gradient(circle at 50% 38%,#000 0,transparent 55%)}
@keyframes pm-spin{to{transform:rotate(360deg)}}
.lad-cele .lc-pv{animation:pm-pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pm-pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
/* Sticker-Tüte */
.lad-pack{width:min(720px,100%)}
.lad-pack h2{margin:0;text-align:center}
.pk-stage{min-height:230px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pk-bag{background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:1.1rem;min-height:44px}
.pk-bag svg{animation:pm-wiggle 1.6s ease-in-out infinite;width:150px;height:auto;filter:drop-shadow(0 8px 8px rgba(80,60,40,.25))}
@keyframes pm-wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) scale(1.04)}}
.pk-card{width:150px;background:#fff;border-radius:22px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 8px 18px rgba(80,60,40,.18);opacity:0;animation:pm-flip .6s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes pm-flip{from{transform:rotateY(90deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.pk-art svg{width:96px;height:96px}
.pk-name{font-weight:800;font-size:.9rem}
.pk-tag{font-size:.8rem;font-weight:800;color:#8a7868;background:#f1e8da;border-radius:10px;padding:2px 10px}
.pk-tag.new{background:#ffd45c;color:#6a4a00}
.pk-page{display:flex;align-items:center;gap:12px;background:#fff3d6;border-radius:20px;padding:8px 14px;justify-content:center}
.pk-page svg{width:56px;height:auto}
.pk-page svg.ico,.pk-page .lad-btn svg{width:auto}
.daily-sticker{display:flex;align-items:center;gap:12px;background:#fff8e1;border-radius:22px;padding:8px 18px;margin:10px auto 0;max-width:460px;box-shadow:0 4px 0 rgba(201,150,42,.25);animation:pm-pop .6s cubic-bezier(.3,1.5,.5,1) .5s both}
.daily-sticker .ds-art svg{width:72px;height:72px;display:block}
.daily-sticker svg{max-width:none}
.daily-sticker b{font-size:1.1rem}
/* Album */
.lad-album{width:min(780px,100%)}
.alb-total{font-weight:800;font-size:1.2rem;background:#fff3d6;border-radius:20px;padding:6px 14px}
.alb-tabs .lad-tab{flex:1 1 100px;min-height:56px}
.alb-page{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px;border-radius:26px;background:color-mix(in srgb,var(--pc) 22%,#fffdf6);border:3px dashed color-mix(in srgb,var(--pc) 60%,#fff);overflow:auto;min-height:0}
.alb-page.glitz{background:linear-gradient(135deg,#fff8dc,color-mix(in srgb,var(--pc) 24%,#fffdf6) 60%,#fff6cf);border-color:#f2c14e}
.alb-slot{background:rgba(255,255,255,.7);border-radius:20px;padding:6px 4px 8px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.alb-slot.got{background:#fff;box-shadow:0 4px 10px rgba(80,60,40,.12)}
.alb-art svg{width:100%;max-width:120px;height:auto;display:block}
.alb-name{font-weight:800;font-size:.85rem;min-height:1.2em}
.alb-slot:not(.got) .alb-name{opacity:.4}
.alb-n{position:absolute;right:6px;top:6px;background:#ffd45c;border-radius:12px;padding:0 8px;font-weight:800;font-size:.85rem}
.alb-full{text-align:center;font-weight:800;color:#3f8a5a;background:#e4f6e9;border-radius:16px;padding:8px}
.alb-hint{text-align:center;color:var(--soft);font-size:.95rem}
/* Lernschild */
.board{width:min(820px,100%);border-top-color:#5b8fd6}
.board-sub{margin:0;color:var(--soft);text-align:center}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;overflow:auto}
.board-tile{background:linear-gradient(180deg,#e9f3ff,#d9eaff);border-radius:22px;min-height:96px;padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;box-shadow:0 4px 0 rgba(63,95,160,.2);position:relative}
.board-tile b{font-size:1.1rem}.board-tile small{color:#5a6a86;line-height:1.15}
.board-tile .bt-ic{font-size:1.7rem;position:absolute;right:12px;top:8px}
.board-tile .bt-lv{margin-top:auto;font-size:.8rem;font-weight:800;background:#fff;border-radius:10px;padding:1px 10px;color:#3f5fa0}
/* Pflege */
.care{width:min(920px,100%);border-top-color:#7cc4ea}
.care-horses{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;flex:none}
.care-hp{flex:none;width:88px;background:#f6efe5;border-radius:18px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent;min-height:70px}
.care-hp.on{background:#e4f3fc;border-color:#7cc4ea}
.care-hp .pvh{width:70px;height:52px;display:block}
.care-hp .pvh svg{width:100%;height:100%}
.care-hp small{font-weight:800;font-size:.72rem;line-height:1.1;text-align:center}
.care-main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;min-height:0;overflow:auto;align-items:start}
.care-stage{position:relative;aspect-ratio:210/170;width:100%;border-radius:28px;background:radial-gradient(ellipse at 50% 100%,#bfe3a8 0,#d9f0c8 38%,#e9f6ff 39%,#eaf7ff 100%);overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 4px #fff,0 6px 16px rgba(80,60,40,.14)}
.care-horse{position:absolute;inset:6% 6% 2% 6%;display:flex;align-items:flex-end}
.care-horse svg{width:100%;height:auto;filter:drop-shadow(0 8px 6px rgba(60,80,40,.25))}
.care-horse.glow svg{animation:pm-glow 1s ease-in-out}
@keyframes pm-glow{0%,100%{filter:drop-shadow(0 8px 6px rgba(60,80,40,.25))}50%{filter:drop-shadow(0 0 18px #ffe58a) brightness(1.08)}}
.care-spot{position:absolute;transform:translate(-50%,-50%);width:64px;height:54px;border-radius:50%;background:none;padding:0;transition:opacity .3s,transform .3s}
.care-spot.dust{background:radial-gradient(ellipse,rgba(160,120,80,.7) 0,rgba(160,120,80,.45) 50%,transparent 72%);filter:blur(1px)}
.care-spot.mud{width:72px;height:56px;background:radial-gradient(ellipse at 40% 40%,#7a5a40 0,#5e4430 55%,transparent 75%);border-radius:44% 56% 52% 48%}
.care-spot.hoof{width:50px;height:50px;border:4px dashed #f2a93b;background:rgba(255,255,255,.55);animation:pm-pulse 1.3s ease-in-out infinite}
.care-spot.knot{width:48px;height:48px;border:4px solid #f48fb1;background:rgba(255,255,255,.7);animation:pm-pulse 1.3s ease-in-out infinite}
.care-spot.knot::after{content:'🪢';font-size:1.5rem}
.care-spot.shine{width:50px;height:50px;border:4px dotted #b39ddb;background:rgba(255,255,255,.55);animation:pm-pulse 1.3s ease-in-out infinite}
.care-spot.shine::after{content:'✨';font-size:1.6rem}
@keyframes pm-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,80,.7)}50%{box-shadow:0 0 0 10px rgba(255,200,80,0)}}
.care-spot.gone{opacity:0!important;transform:translate(-50%,-50%) scale(0)!important;pointer-events:none}
.care-hand{position:absolute;pointer-events:none;font-size:2.4rem;transform:translate(-30%,-80%);display:none;z-index:4;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.care-stage.down .care-hand{display:block}
.care-prog{height:10px;background:#e9e1d6;border-radius:6px;margin-top:8px;overflow:hidden}
.care-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cc4ea,#5fbf86);transition:width .3s;border-radius:6px}
.care-right{display:flex;flex-direction:column;gap:10px}
.care-name{display:flex;align-items:center;justify-content:space-between;font-size:1.3rem}
.care-hearts span{color:#e6d6d6;font-size:1.4rem}.care-hearts span.on{color:#ec6f9c}
.care-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.care-tool{min-height:76px;border-radius:18px;background:#f6efe5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:800;font-size:.85rem;position:relative;border:3px solid transparent}
.care-tool.on{background:#e4f3fc;border-color:#7cc4ea}
.care-tool.locked{opacity:.55}
.care-tool em{position:absolute;right:6px;top:2px;font-style:normal}
.ct-ic{height:40px;display:flex;align-items:center}.ct-ic svg{height:38px;width:auto}.ct-ic .ci-e{font-size:2rem}
.care-tip{margin:0;background:#fff7dd;border-radius:16px;padding:10px 14px;font-weight:700;min-height:3.2em}
.care-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.care-acc b{width:100%}
.care-acc .chip{display:flex;align-items:center;gap:6px}
.ca-ic svg{width:30px;height:30px;display:block}
.care-counters{display:flex;gap:8px}.care-counters .counter{height:48px;font-size:1.1rem;background:#fff3d6;box-shadow:none}.care-counters svg{width:30px;height:30px}
/* Reiterstübchen */
.room-wrap{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:6px 18px 18px;min-height:100%}
.room-scene{position:relative;width:100%;max-width:calc((100dvh - 250px)*1.5);margin:0 auto;aspect-ratio:3/2;border-radius:30px;overflow:hidden;box-shadow:0 14px 34px rgba(80,60,40,.28),0 0 0 8px #e9cfa8,0 0 0 11px #c79f6c;touch-action:none;background:#f9e3ea}
@media (orientation:portrait){.room-scene{aspect-ratio:1/1;max-width:none}}
.room-wall{position:absolute;inset:0 0 38% 0;background:repeating-linear-gradient(90deg,#fbe4ec 0 34px,#fdf0f4 34px 68px);box-shadow:inset 0 -30px 40px rgba(255,255,255,.35)}
.room-board{position:absolute;left:0;right:0;top:56%;height:7%;background:linear-gradient(180deg,#fff9ee,#f0e2cc);border-top:3px solid #fff;box-shadow:0 4px 8px rgba(120,80,40,.18)}
.room-floor{position:absolute;inset:63% 0 0 0;background:repeating-linear-gradient(90deg,#dba873 0 92px,#cf9a64 92px 95px),linear-gradient(180deg,#e0b07b,#c99560);background-blend-mode:multiply}
.room-kamin{position:absolute;left:41%;top:38%;width:15%;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.room-kamin svg{display:block;width:100%;height:auto}
.room-kamin .flame{transform-origin:60px 96px;animation:pm-flame 1.2s ease-in-out infinite alternate}
@keyframes pm-flame{from{transform:scale(1,1)}to{transform:scale(.94,1.1)}}
.rm-item{position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab;outline:none;-webkit-tap-highlight-color:transparent}
.rm-item.wall{transform:translate(-50%,-50%)}
.rm-item .rm-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 5px 4px rgba(60,30,20,.2))}
.rm-item.drag{cursor:grabbing;transform:translate(-50%,-100%) scale(1.07)}
.rm-item.wall.drag{transform:translate(-50%,-50%) scale(1.07)}
.rm-item:focus-visible{outline:3px solid #5b8fd6;outline-offset:4px;border-radius:8px}
.rm-item.wob{animation:pm-wob .5s ease}
@keyframes pm-wob{0%,100%{rotate:0deg}25%{rotate:-4deg}60%{rotate:3deg}}
.rm-item.lit::after{content:'';position:absolute;left:50%;top:-6%;width:340%;height:130%;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,226,140,.55),transparent 65%);pointer-events:none;z-index:-1}
.room-scene.night::after{content:'';position:absolute;inset:0;background:rgba(48,32,96,.22);pointer-events:none;z-index:900}
.rm-ros{position:absolute;left:14%;right:14%;top:14%;display:flex;flex-wrap:wrap;gap:3%;justify-content:center;pointer-events:none}
.rm-ros span{width:22%;font-size:1rem;line-height:1}.rm-ros svg{width:100%;height:auto}
.room-empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(255,253,248,.92);border-radius:22px;padding:14px 22px;text-align:center;display:flex;flex-direction:column;gap:2px;z-index:950;box-shadow:0 6px 16px rgba(80,60,40,.2)}
.room-tip{margin:0;text-align:center;color:var(--soft);font-size:.95rem}
.room-dock{align-self:center;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.room-dock .bigbtn{min-width:150px;min-height:64px;font-size:1.1rem;padding:6px 16px}
.room-count{font-weight:800;color:var(--soft)}
/* Hof-Menü */
.farm-dock{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:30}
.dock-toggle{min-width:96px;height:64px;border-radius:32px;background:linear-gradient(180deg,#ffe9a0,#ffd04f);box-shadow:0 4px 0 #c9962a,0 10px 20px rgba(80,60,40,.25);display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.6rem;padding:0 18px}
.dock-toggle b{font-size:1.05rem}
.dock-toggle:active{transform:translateY(3px)}
.dock-menu{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:12px;background:rgba(255,253,248,.95);border-radius:28px;box-shadow:0 14px 32px rgba(80,60,40,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dock-menu.open{display:grid;animation:pm-pop .3s cubic-bezier(.3,1.5,.5,1)}
.dock-item{min-width:144px;min-height:62px;border-radius:20px;background:#fff3d6;font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;padding:0 14px;box-shadow:0 3px 0 rgba(201,150,42,.3)}
.dock-item .di-ic{font-size:1.6rem}
.dock-item:active{transform:translateY(2px)}
@media (max-width:600px){.lad-grid{grid-template-columns:repeat(2,1fr)}.care-main{grid-template-columns:1fr}.alb-page{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.pk-bag svg,.lc-rays,.lad-card.ready .lc-art,.room-kamin .flame,.care-spot{animation:none!important}}
:where(.ih){display:inline-flex;vertical-align:middle;align-items:center}
:where(.ih) svg{width:1.3em;height:1.3em}
.lad-note .ih svg,.pk-page .ih svg,.lc-left .ih svg{width:1.3em;height:1.3em}
/* Mini-Spiele */
.mg-wrap{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:4px 14px 14px}
.mg-hud{display:flex;align-items:center;gap:12px;justify-content:space-between;flex:none}
.mg-score{font-size:1.5rem;font-weight:800;background:#fffdf8;border-radius:26px;padding:8px 20px;box-shadow:var(--shadow);display:flex;gap:16px}
.mg-hud .smallbtn{min-height:52px;font-size:1.05rem}
.mg-stage{position:relative;flex:1;min-height:0;border-radius:30px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 4px #fff,0 8px 20px rgba(80,60,40,.2)}
.mg-stage.apple{background:linear-gradient(180deg,#bfe6fb 0,#e6f6ff 45%,#bfe6a8 45.5%,#8fcb7a 100%)}
.ap-crown{position:absolute;left:-5%;right:-5%;top:-14%;height:34%;background:radial-gradient(ellipse at 20% 60%,#58b86a 0 28%,transparent 29%),radial-gradient(ellipse at 45% 70%,#4fa862 0 30%,transparent 31%),radial-gradient(ellipse at 72% 62%,#58b86a 0 28%,transparent 29%),radial-gradient(ellipse at 95% 70%,#4fa862 0 26%,transparent 27%);filter:drop-shadow(0 8px 6px rgba(40,90,50,.25))}
.ap-apple{position:absolute;top:12px;width:54px;height:54px;transform:translateX(-50%);will-change:top}
.ap-apple svg{width:100%;height:100%;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2))}
.ap-apple.in{transition:transform .25s,opacity .25s;transform:translateX(-50%) scale(.5);opacity:0}
.ap-apple.miss{transition:opacity .9s;opacity:0}
.ap-basket{position:absolute;bottom:5%;width:150px;transform:translateX(-50%);z-index:3}
.ap-basket svg{width:100%;height:auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.22))}
.ap-basket.wob{animation:pm-wob .35s}
.mg-stage.ride{background:linear-gradient(180deg,#b9e2dc 0,#eef9f2 55%,#bfe6a8 55.5%)}
.rd-far,.rd-mid,.rd-near{position:absolute;left:0;right:0;background-repeat:repeat-x;background-position:0 100%;background-size:auto 100%}
.rd-far{bottom:26%;height:34%;opacity:.8}.rd-mid{bottom:22%;height:44%}.rd-near{bottom:-8%;height:56%;z-index:4;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 70%,#000 71%);mask-image:linear-gradient(180deg,transparent 0,transparent 70%,#000 71%)}
.rd-ground{position:absolute;left:0;right:0;bottom:0;height:27%;background:linear-gradient(180deg,#9bd47f,#7bbf66 40%,#6aae5a);box-shadow:inset 0 6px 0 rgba(255,255,255,.2)}
.rd-ground::after{content:'';position:absolute;left:0;right:0;top:34%;height:26%;background:#d9bd8a;opacity:.75;border-radius:50%/100%}
.rd-horse{position:absolute;left:0;bottom:calc(18% + 6px);width:clamp(150px,22vw,230px);z-index:3;will-change:transform}
.rd-horse .rd-bob{animation:rd-bob .36s ease-in-out infinite alternate}
.rd-horse.air .rd-bob,.rd-horse.stop .rd-bob{animation:none}
.rd-horse.stumble .rd-bob{animation:pm-wob .4s infinite}
@keyframes rd-bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.rd-horse svg{width:100%;height:auto;filter:drop-shadow(0 8px 5px rgba(0,0,0,.2))}
.rd-item{position:absolute;left:0;bottom:calc(18% + 6px);z-index:2;will-change:transform}
.rd-item.log{width:clamp(60px,8vw,90px)}
.rd-item.star{width:clamp(34px,4.4vw,48px);bottom:calc(18% + 40px);filter:drop-shadow(0 0 8px rgba(255,226,120,.9))}
.rd-item svg{width:100%;height:auto;display:block}
.rd-item.got{opacity:0;transition:opacity .25s}
.rd-item.gone{opacity:0;transition:opacity .5s}
.rd-hint{text-align:center;font-weight:800;color:#3f6f52;background:rgba(255,255,255,.85);border-radius:20px;padding:8px 16px;align-self:center;flex:none;transition:opacity .6s}
.rd-hint.hide{opacity:0}
.mg-stage.mem{background:linear-gradient(180deg,#e9f6ff,#fff4e0);display:flex;align-items:center;justify-content:center;padding:14px;touch-action:manipulation}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(100%,780px);max-height:100%;align-content:center}
.mem-grid.c6,.mem-grid.c8{grid-template-columns:repeat(4,1fr)}.mem-grid.c12{grid-template-columns:repeat(4,1fr)}.mem-grid.c16{grid-template-columns:repeat(4,1fr)}
.mem-card{aspect-ratio:1/1;min-height:70px;background:none;padding:0;perspective:700px}
.mem-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}

<div id="app" aria-live="polite"></div>
<noscript>Bitte JavaScript aktivieren, damit Pferde-Mathe funktioniert.</noscript>
<script>window.__PM_SINGLE__ = true;</script>
<script>
/* Pferde-Mathe – Klang-Engine (WebAudio, alles synthetisch: keine Dateien, kein Netzwerk)
 * Busse: Effekte · Musik · Umgebung → Master → sanfter Kompressor → Ausgabe.
 * Einstellungen (Elternbereich): S.sound (Master an/aus), S.volume (Master-Lautstärke 0–1),
 * S.audio = { music, sfx, amb, mvol }.
 * iOS: Der AudioContext wird erst bei der ersten Berührung erzeugt und „entsperrt“ (resume + stiller Puffer).
 */
(function () {
  'use strict';
  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pickOf = (a) => a[Math.floor(Math.random() * a.length)];
  function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  const DEFAULT_AUDIO = { music: true, sfx: true, amb: true, mvol: 0.5 };
  let getS = () => ({ sound: true, volume: 0.5, audio: DEFAULT_AUDIO });
  function cfg() {
    const S = getS() || {};
    const a = Object.assign({}, DEFAULT_AUDIO, S.audio || {});
    return { on: S.sound !== false, vol: typeof S.volume === 'number' ? Math.max(0, Math.min(1, S.volume)) : 0.5, music: !!a.music, sfx: !!a.sfx, amb: !!a.amb, mvol: Math.max(0, Math.min(1, a.mvol)) };
  }

  // ======================= Engine-Fabrik (Echtzeit oder Offline für Tests) =======================
  function createEngine(c, offline) {
    const sr = c.sampleRate;
    const master = c.createGain();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.25;
    master.connect(comp); comp.connect(c.destination);
    const sfxBus = c.createGain(), musicBus = c.createGain(), ambBus = c.createGain();
    const musicLP = c.createBiquadFilter(); musicLP.type = 'lowpass'; musicLP.frequency.value = 5200; musicLP.Q.value = 0.3;
    sfxBus.connect(master); musicBus.connect(musicLP); musicLP.connect(master); ambBus.connect(master);
    // sanfter Hall (Faltung mit erzeugtem Rauschen) – gibt allem Wärme
    const verb = c.createConvolver(); const vg = c.createGain(); vg.gain.value = 0.22;
    { const len = Math.floor(sr * 1.6), buf = c.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      verb.buffer = buf; }
    const verbIn = c.createGain(); verbIn.gain.value = 1; verbIn.connect(verb); verb.connect(vg); vg.connect(master);
    let noiseBuf = null;
    function noise() {
      if (!noiseBuf) { const len = sr * 2, b = c.createBuffer(1, len, sr), d = b.getChannelData(0); let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = 0.6 * last + 0.4 * w; d[i] = last * 1.6; } noiseBuf = b; }
      return noiseBuf;
    }
    const now = () => c.currentTime;
    function env(g, t, peak, a, dur) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + Math.max(0.003, a));
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(a + 0.02, dur));
    }
    function send(node, amt) { const s = c.createGain(); s.gain.value = amt; node.connect(s); s.connect(verbIn); }
    // Grundbausteine -------------------------------------------------------
    function tone(f, t, dur, type, g, f2, dst, rev) {
      const o = c.createOscillator(), v = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.85);
      env(v, t, g == null ? 0.4 : g, 0.012, dur);
      o.connect(v); v.connect(dst || sfxBus); if (rev) send(v, rev);
      o.start(t); o.stop(t + dur + 0.05);
      return v;
    }
    function nz(t, dur, g, ftype, f1, f2, q, dst, rev) {
      const s = c.createBufferSource(); s.buffer = noise(); s.loop = true;
      const f = c.createBiquadFilter(); f.type = ftype || 'bandpass'; f.Q.value = q || 1;
      f.frequency.setValueAtTime(f1 || 1000, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
      const v = c.createGain(); env(v, t, g, 0.008, dur);
      s.connect(f); f.connect(v); v.connect(dst || sfxBus); if (rev) send(v, rev);
      s.start(t, Math.random() * 1.2); s.stop(t + dur + 0.05);
      return v;
    }
    // Instrumente ------------------------------------------------------------
    function bell(f, t, dur, g, dst, rev) { // Glockenspiel: leicht unharmonische Obertöne
      tone(f, t, dur, 'sine', g, null, dst, rev == null ? 0.5 : rev);
      tone(f * 2.76, t, dur * 0.45, 'sine', g * 0.18, null, dst);
      tone(f * 5.4, t, dur * 0.2, 'sine', g * 0.06, null, dst);
    }
    function musicBox(f, t, g, dst) { tone(f, t, 1.1, 'sine', g, null, dst, 0.6); tone(f * 3, t, 0.35, 'sine', g * 0.2, null, dst); tone(f * 4.01, t, 0.15, 'sine', g * 0.08, null, dst); }
    function marimba(f, t, g, dst) { tone(f, t, 0.55, 'sine', g, null, dst, 0.3); tone(f * 4, t, 0.12, 'sine', g * 0.25, null, dst); nz(t, 0.025, g * 0.25, 'bandpass', f * 3, null, 2, dst); }
    function pluck(f, t, g, dst, len) { const v = tone(f, t, len || 0.7, 'triangle', g, null, dst, 0.3); tone(f * 2, t, (len || 0.7) * 0.4, 'sine', g * 0.3, null, dst); return v; }
    function harp(f, t, g, dst) { tone(f, t, 1.3, 'triangle', g, null, dst, 0.5); tone(f * 2, t, 0.6, 'sine', g * 0.35, null, dst); tone(f * 3, t, 0.25, 'sine', g * 0.1, null, dst); }
    function kalimba(f, t, g, dst) { tone(f, t, 0.9, 'sine', g, null, dst, 0.5); tone(f * 5.4, t, 0.1, 'sine', g * 0.14, null, dst); nz(t, 0.02, g * 0.2, 'bandpass', 2600, null, 2, dst); }
    function pad(f, t, dur, g, dst) {
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.4;
      const v = c.createGain(); v.gain.setValueAtTime(0.0001, t); v.gain.linearRampToValueAtTime(g, t + Math.min(0.9, dur * 0.3)); v.gain.setValueAtTime(g, t + dur * 0.62); v.gain.linearRampToValueAtTime(0.0001, t + dur);
      [-6, 6].forEach((d, i) => { const o = c.createOscillator(); o.type = i ? 'triangle' : 'sawtooth'; o.frequency.value = f; o.detune.value = d; const og = c.createGain(); og.gain.value = i ? 0.8 : 0.35; o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 0.05); });
      lp.connect(v); v.connect(dst || musicBus); send(v, 0.3);
    }
    function flute(f, t, dur, g, dst) {
      const o = c.createOscillator(), v = c.createGain(), l = c.createOscillator(), lg = c.createGain();
      o.type = 'sine'; o.frequency.value = f; l.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.012, t + dur * 0.6); l.connect(lg); lg.connect(o.frequency);
      v.gain.setValueAtTime(0.0001, t); v.gain.linearRampToValueAtTime(g, t + 0.09); v.gain.setValueAtTime(g * 0.9, t + dur * 0.7); v.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(v); v.connect(dst || musicBus); send(v, 0.4); o.start(t); l.start(t); o.stop(t + dur + 0.05); l.stop(t + dur + 0.05);
      nz(t, dur * 0.6, g * 0.12, 'bandpass', f * 2, null, 3, dst || musicBus);
    }
    function softBass(f, t, dur, g, dst) { tone(f, t, dur, 'sine', g, null, dst || musicBus); tone(f * 2, t, dur * 0.4, 'triangle', g * 0.2, null, dst || musicBus); }
    // Tierlaute --------------------------------------------------------------
    function formantVoice(t, dur, f0pts, formants, g, saw, dst, vib) {
      const o = c.createOscillator(); o.type = saw || 'sawtooth';
      f0pts.forEach(([dt, f], i) => { if (i === 0) o.frequency.setValueAtTime(f, t + dt); else o.frequency.linearRampToValueAtTime(f, t + dt); });
      const v = c.createGain(); v.gain.setValueAtTime(0.0001, t); v.gain.linearRampToValueAtTime(g * 2.5, t + Math.min(0.08, dur * 0.2)); v.gain.setValueAtTime(g * 2.5, t + dur * 0.6); v.gain.linearRampToValueAtTime(0.0001, t + dur);
      if (vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = vib[0]; lg.gain.value = vib[1]; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.05); }
      formants.forEach(([fa, fb, q, gain]) => { const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(fa, t); f.frequency.linearRampToValueAtTime(fb, t + dur); const fg = c.createGain(); fg.gain.value = gain; o.connect(f); f.connect(fg); fg.connect(v); });
      v.connect(dst || sfxBus); send(v, 0.25); o.start(t); o.stop(t + dur + 0.05);
    }
    function chirpOne(t, f1, f2, dur, g, dst) { const o = c.createOscillator(), v = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur); env(v, t, g, 0.01, dur); o.connect(v); v.connect(dst || sfxBus); send(v, 0.2); o.start(t); o.stop(t + dur + 0.03); }
    return { c, sr, master, sfxBus, musicBus, ambBus, musicLP, verbIn, noise, now, env, tone, nz, bell, musicBox, marimba, pluck, harp, kalimba, pad, flute, softBass, formantVoice, chirpOne, send };
  }

  // ======================= Sound-Effekte =======================
  function sfxLib(E) {
    const { c, tone, nz, bell, formantVoice, chirpOne } = E;
    const T = (d) => E.now() + (d || 0);
    const L = {
      tap(d) { const t = T(d), f = 640 * rnd(0.96, 1.05); tone(f, t, 0.09, 'sine', 0.22, f * 0.7); nz(t, 0.02, 0.05, 'bandpass', 2200, null, 2); },
      pop(d) { const t = T(d); tone(620, t, 0.12, 'sine', 0.3, 900); tone(1040, t + 0.06, 0.16, 'sine', 0.16, null, null, 0.3); },
      plop(d) { const t = T(d); tone(520, t, 0.2, 'sine', 0.34, 170); nz(t, 0.04, 0.05, 'lowpass', 900); },
      correct(d, streak) {
        const t = T(d), s = Math.min(4, streak || 0);
        const pats = [[0, 4, 7, 12], [2, 5, 9, 14], [0, 7, 4, 12], [4, 7, 11, 16], [-5, 0, 4, 7]];
        const base = 72 + s;
        pickOf(pats).forEach((n, i) => bell(midi(base + n), t + i * 0.09, 0.7, 0.22));

<script>
/* Pferde-Mathe – Zahlenraum bis 100 (Modul): 7 neue Übungsspiele + Welt 6 „Zauberwald der Hundert“.
   Alles lokal, keine Netzwerkaufrufe. Wird von app.js über window.PM_MODS eingebunden. */
(window.PM_MODS = window.PM_MODS || []).push(function (core) {
'use strict';
const { h, $, $$, rand, pick, shuffle, range, sleep, MINUS, Sound, ROUND, softNo, lunaSVG } = core;
core.b100 = {};
const GAMES = core.GAMES, GAME_TYPES = core.GAME_TYPES, TYPE_LABELS = core.TYPE_LABELS;

// ---------- gemeinsame Bausteine ----------
const zn = (n) => Math.floor(n / 10), en = (n) => n % 10;
const zerl = (n) => `${zn(n)} Zehner und ${en(n)} Einer`;

/** Zehnerstangen + Einerwürfel */
function stangen(n, opts) {
  opts = opts || {};
  const z = zn(n), e = en(n);
  const wrap = h('div', { class: 'zevis' + (opts.small ? ' small' : '') });
  const rods = h('div', { class: 'zrods' });
  for (let i = 0; i < z; i++) {
    const r = h('div', { class: 'zstab' }, range(1, 10).map(() => h('i')));
    if (opts.labels) r.append(h('b', null, String((i + 1) * 10)));
    rods.append(r);
  }
  const cubes = h('div', { class: 'ecubes' });
  for (let i = 0; i < e; i++) {
    const c = h('i', { class: 'ecube' });
    if (opts.labels) c.textContent = String(i + 1);
    cubes.append(c);
  }
  if (z) wrap.append(rods);
  if (e || !z) wrap.append(cubes);
  return wrap;
}

/** Hunderterfeld */
function hunderterfeld(o) {
  o = o || {};
  const grid = h('div', { class: 'hf' + (o.small ? ' small' : '') + (o.labels === 'none' ? ' nolab' : '') });
  const cells = {};
  for (let n = 1; n <= 100; n++) {
    const r = Math.floor((n - 1) / 10);
    let txt = '';
    if (o.labels === 'all' || o.labels === undefined) txt = String(n);
    else if (o.labels === 'ends' && n % 10 === 0) txt = String(n);
    if (o.blank && o.blank.indexOf(n) >= 0) txt = '';
    const c = o.onTap ? h('button', { class: 'hf-cell r' + (r % 2), 'data-n': n, 'aria-label': 'Feld ' + n, type: 'button' }, txt) : h('div', { class: 'hf-cell r' + (r % 2), 'data-n': n }, txt);
    if (o.onTap) c.addEventListener('click', () => o.onTap(n, c));
    cells[n] = c; grid.append(c);
  }
  return {
    el: grid, cell: (n) => cells[n],
    mark(n, cls) { if (cells[n]) cells[n].classList.add(cls || 'on'); },
    clear(cls) { Object.values(cells).forEach((c) => c.classList.remove(...(cls ? [cls] : ['on', 'hint', 'step1', 'step2', 'row', 'glow', 'yes', 'soft-no']))); },
    row(n, cls) { const r = Math.floor((n - 1) / 10); for (let i = 1; i <= 10; i++) cells[r * 10 + i].classList.add(cls || 'row'); },
    text(n, t) { if (cells[n]) cells[n].textContent = t; }
  };
}

/** Zifferntastatur mit einem oder mehreren Feldern */
function keypad(o) {
  const fields = o.fields.map((f) => Object.assign({ len: 2, pre: '', post: '' }, f));
  const vals = fields.map(() => '');
  let active = 0, locked = false;
  const wrap = h('div', { class: 'kp' });
  const row = h('div', { class: 'kp-fields' });
  const fEls = fields.map((f, i) => {
    const box = h('button', { type: 'button', class: 'kp-box', 'data-f': i, 'aria-label': 'Feld ' + (i + 1) });
    box.addEventListener('click', () => { if (locked) return; vals[i] = ''; active = i; paint(); Sound.tap(); });
    row.append(f.pre ? h('span', { class: 'kp-pre' }, f.pre) : '', box, f.post ? h('span', { class: 'kp-post' }, f.post) : '');
    return box;
  });
  const pad = h('div', { class: 'kp-pad' });
  const digit = (d) => {
    if (locked) return;
    Sound.tap();
    const f = fields[active];
    if (vals[active].length >= f.len) vals[active] = '';
    vals[active] += String(d);
    if (vals[active].length >= f.len && active < fields.length - 1) active++;
    paint();

/** Aufgabenschleife */
function loop(api, stage, tasks, render) {
  let idx = 0;
  const next = () => { stage.innerHTML = ''; stage.style.display = ''; if (idx >= tasks.length) { core.b100.cur = null; api.finish(); return; } const t = tasks[idx++]; core.b100.cur = t; core.b100.n = idx; render(t, next); };
  next();
}
function unique(gen, n) {
  const out = [], seen = new Set(); let g = 0;
  while (out.length < (n || ROUND) && g++ < 600) { const t = gen(out.length); if (!t) continue; if (seen.has(t.key)) continue; seen.add(t.key); out.push(t); }
  while (out.length < (n || ROUND)) { let t, g2 = 0; do { t = gen(out.length); } while (!t && g2++ < 1000); out.push(t); } // Notnagel (Duplikate), falls das Zahlenfeld klein ist
  return out;
}
const TS = (n) => `${zn(n)} Z + ${en(n)} E`;

/** Standard-Antwortfluss für Aufgaben mit Tastatur */
function answerFlow(api, t, kp, ctx) {
  // ctx: {check(vals)->bool, hints:[fn,fn], reveal:[...], expl: text, anchor: el, next}
  let errs = 0;
  return {
    get errs() { return errs; },
    submit(vals) {
      if (ctx.check(vals)) {
        kp.done(true); kp.lock(true); Sound.correct();
        api.done(t.type, errs === 0, ctx.anchor);
        api.say(api.praise() + ' ' + (ctx.expl || ''), 'happy');
        setTimeout(ctx.next, 2000);
        return;
      }
      errs++; kp.shake(); Sound.softno(); api.miss(t.type, t.label);
      kp.fieldEls.forEach((b) => softNo(b));
      if (errs === 1) ctx.hints[0]();
      else if (errs === 2) ctx.hints[1]();
      else { kp.fill(ctx.reveal); api.say('Schau, die Lösung steht schon da. Tippe auf den Haken ✓.', 'think'); return; }
      setTimeout(() => kp.clear(), 500);
    }
  };
}

// Zahlenstrahl-Baustein (frei positioniert)
// =====================================================================
function nline(lo, hi, step, o) {
  o = o || {};
  const span = hi - lo;
  const xp = (n) => ((n - lo) / span) * 100;
  const wrap = h('div', { class: 'nl' });
  const horse = h('div', { class: 'nl-horse', html: lunaSVG() });
  const axis = h('div', { class: 'nl-axis' });
  axis.style.setProperty('--minor', (100 / span) + '%');
  const ticks = {};
  const tickList = [];
  for (let n = lo; n <= hi; n += step) {
    const showLabel = o.labelAll || (o.labels && o.labels.indexOf(n) >= 0) || (!o.labels && true);
    const t = h('button', { type: 'button', class: 'nl-tick' + (n % 10 === 0 ? ' ten' : '') + (n % 50 === 0 ? ' fifty' : ''), 'data-n': n, 'aria-label': 'Zahl ' + n, style: { left: xp(n) + '%' } },
      h('span', { class: 'm' }), h('span', { class: 'lb' }, showLabel ? String(n) : ''));
    if (o.onTap) t.addEventListener('click', () => o.onTap(n, t));
    else { t.tabIndex = -1; t.style.pointerEvents = 'none'; }
    ticks[n] = t; tickList.push(t); wrap.append(t);
  }
  wrap.append(axis, horse);
  let pos = o.start != null ? o.start : lo;
  const place = () => { horse.style.left = xp(pos) + '%'; };
  place();
  return {
    el: wrap, tick: (n) => ticks[n], list: tickList, xp, horse,
    get pos() { return pos; },
    setPos(n) { pos = n; place(); },
    label(n, txt) { const l = $('.lb', ticks[n]); if (l) l.textContent = txt != null ? txt : String(n); },
    arc(from, to, txt, cls) {
      const a = h('span', { class: 'nl-arc ' + (cls || ''), style: { left: ((xp(from) + xp(to)) / 2) + '%', width: Math.abs(xp(to) - xp(from)) + '%' } }, h('b', null, txt));
      wrap.append(a); return a;
    },
    clearArcs() { $$('.nl-arc', wrap).forEach((a) => a.remove()); },
    async hop(to, speed, label, big) {
      const from = pos; const dir = to > from ? 1 : -1;
      horse.classList.remove('hop'); void horse.offsetWidth; horse.classList.add('hop');
      pos = to; place(); Sound.hop();
      this.arc(from, to, label != null ? label : (to > from ? '+' : MINUS) + Math.abs(to - from), (dir > 0 ? 'fw' : 'bw') + (big ? ' big' : ''));
      await sleep(speed || 600);
    }
  };
}

// =====================================================================
// 7) Plus und Minus bis 100
// =====================================================================
function pmTask(L) {
  const R = rand;
  let a, b, plus, type;
  switch (L) {
    case 1: plus = Math.random() < 0.5; if (plus) { a = R(1, 8) * 10; b = R(1, (100 - a) / 10) * 10; } else { a = R(3, 10) * 10; b = R(1, a / 10 - 1) * 10; } type = 'pm-zehner'; break;
    case 2: plus = Math.random() < 0.6; if (plus) { a = R(1, 9) * 10; b = R(1, 9); } else { a = R(2, 9) * 10 + R(2, 9); b = en(a); } type = 'pm-zplus-e'; break;
    case 3: plus = Math.random() < 0.55; if (plus) { a = R(1, 9) * 10 + R(1, 8); b = R(1, 9 - en(a)); if (en(a) + b === 10) b--; if (b < 1) return null; } else { a = R(2, 9) * 10 + R(2, 9); b = R(1, en(a) - 1); if (b < 1) return null; } type = 'pm-ohne'; break;

  if (res < 0 || res > 100) return null;

function makeApi(game, root, opts) {
  opts = opts || {};
  const sk = S.skills[game.id];
  const results = [];
  const missed = new Set();
  let doneCount = 0;
  const prog = $('.progress', root);
  const api = {
    level: opts.level != null ? opts.level : sk.level,
    say,
    praise() { const l = PRAISE.concat([`${LN()} freut sich! 🥰`]); return pick(kidName() ? l.concat([withName('Toll', '! 💖')]) : l); },
    miss(type, label, key) {
      Sound.hint();
      S.stats[type] = S.stats[type] || { n: 0, ok: 0, hints: 0 };
      S.stats[type].hints++;
      const k = key || label;
      if (!missed.has(k)) {
        missed.add(k);
        S.trouble.unshift({ t: type, l: label, d: Date.now() });
        S.trouble = S.trouble.slice(0, 40);
      }
      save();
    },
    done(type, firstTry, el) {
      S.stats[type] = S.stats[type] || { n: 0, ok: 0, hints: 0 };
      S.stats[type].n++;
      if (firstTry) S.stats[type].ok++;
      results.push(!!firstTry);
      S.shoes++; S.totalShoes++;
      doneCount++;
      save(); updateCounters();
      Sound.correct();
      if (el) burst(el);
      const slots = $$('.progress span', root);
      if (slots[doneCount - 1]) { slots[doneCount - 1].innerHTML = SHOE; slots[doneCount - 1].classList.add('on'); }
    },
    finish() {
      const ok = results.filter(Boolean).length;
      const acc = results.length ? ok / results.length : 1;
      sk.rounds++;
      const natural = api.level === sk.level;
      if (natural) sk.recent = sk.recent.concat(results).slice(-12);
      const recentAcc = sk.recent.filter(Boolean).length / Math.max(1, sk.recent.length);
      let levelUp = false;
      if (natural && acc >= 0.8 && sk.recent.length >= 8 && recentAcc >= 0.8 && sk.level < game.maxLevel) {
        sk.level++; sk.recent = []; levelUp = true;
      } else if (natural && acc < 0.4 && sk.level > 1) {
        sk.level--; sk.recent = [];
      }
      S.carrots++;
      const extra = roundExtraFood();
      S.lastRound = { game: game.id, level: api.level, n: results.length, ok, at: Date.now(), extra };
      if (core.hooks.roundDone) { try { core.hooks.roundDone(S.lastRound, game); } catch (e) { console.error('roundDone', e); } }
      save();
      if (opts.onFinish) opts.onFinish({ n: results.length, ok, levelUp });
      else showRoundEnd(game, results.length, levelUp);
    }
  };
  return api;
}

// ---------- 5) Zahlenstrahl-Hüpfen ----------
function genLineTasks(L) {
  const out = [], seen = new Set();
  let guard = 0;
  while (out.length < ROUND && guard++ < 300) {
    let t;
    if (L === 1) { const n = rand(1, 10); t = { kind: 'find', target: n, type: 'strahl-finden-10' }; }
    else if (L === 2) { let n; do { n = rand(1, 19); } while (n % 5 === 0 && Math.random() < 0.8); t = { kind: 'find', target: n, type: 'strahl-finden-20' }; }
    else if (L === 3) {
      const plus = Math.random() < 0.6, k = rand(1, 5);
      let s;
      if (plus) { s = pick([rand(0, 9), rand(10, 19)]); const lim = s < 10 ? 10 : 20; if (s + k > lim) continue; t = { start: s, step: k, target: s + k }; }
      else { s = pick([rand(2, 10), rand(11, 20)]); const lim = s > 10 ? 10 : 0; if (s - k < lim) continue; t = { start: s, step: -k, target: s - k }; }
      t.kind = 'hop'; t.type = 'strahl-huepfen';
    } else {
      const plus = Math.random() < 0.55;
      if (plus) { const s = rand(5, 9), k = rand(11 - s, Math.min(9, 18 - s)); t = { start: s, step: k, target: s + k }; }
      else { const s = rand(11, 16), k = rand(s - 9, Math.min(9, s - 3)); t = { start: s, step: -k, target: s - k }; }
      t.kind = 'hop'; t.type = 'strahl-zehner';
    }
    const key = JSON.stringify([t.target, t.start, t.step]);
    if (seen.has(key)) continue;
    seen.add(key); out.push(t);
  }
  return out;
}

function judgeTask() {
  const L = (S.skills.rechnen && S.skills.rechnen.level) || 1;
  let a, b, op = '+';
  for (let k = 0; k < 50; k++) {
    if (L <= 1) { a = rand(1, 6); b = rand(1, 10 - a); op = '+'; }
    else if (L === 2) { op = pick(['+', '−']); if (op === '+') { a = rand(2, 8); b = rand(1, 10 - a); } else { a = rand(4, 10); b = rand(1, a - 1); } }
    else if (L === 3) { op = pick(['+', '−']); if (op === '+') { a = rand(11, 16); b = rand(1, 19 - a); } else { a = rand(13, 19); b = rand(1, a - 11); } }
    else { op = pick(['+', '+', '−']); if (op === '+') { a = rand(5, 9); b = rand(11 - a, 9); } else { a = rand(11, 16); b = rand(a - 9, 9); } }
    if (a > 0 && b > 0) break;
  }
  const res = op === '+' ? a + b : a - b;
  const opts = shuffle([res].concat(shuffle([res - 1, res + 1, res + 2, res - 2].filter((x) => x >= 0 && x !== res)).slice(0, 2)));
  return { q: `${a} ${op} ${b} = ?`, res, opts };
}

function catmull(pts) {

    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;

  const d = catmull(pts);

    <path d="${d}" stroke="#d9bf86" stroke-width="40" stroke-opacity=".35" fill="none" stroke-linecap="round"/>
    <path d="${d}" stroke="#f8ebc8" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="${d}" stroke="#fff8e4" stroke-width="10" stroke-opacity=".75" fill="none" stroke-linecap="round"/>
    <path d="${d}" stroke="#e3cb94" stroke-width="5" stroke-dasharray="1 22" fill="none" stroke-linecap="round"/>
    ${donePts.length > 1 ? `<path class="goldtrail" d="${catmull(donePts)}" stroke="#f2c14e" stroke-width="6" stroke-dasharray="1 22" fill="none" stroke-linecap="round"/>` : ''}
